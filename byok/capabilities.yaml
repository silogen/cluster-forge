# A capability name maps to a shell probe. The probe exits zero when the
# cluster already gives the capability.
#
# Reserved names, not implemented yet: autoscaling.keda, gpu.amd.
# gateway.api.crds gives the CRDs only, with no gateway implementation.
gateway.api.crds:
  probe: kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1
gateway.api:
  probe: kubectl get gatewayclass envoy-gateway >/dev/null 2>&1
tls.cluster-cert:
  probe: kubectl get secret cluster-tls -n envoy-gateway-system >/dev/null 2>&1
gateway.https:
  probe: kubectl get gateway https -n envoy-gateway-system >/dev/null 2>&1
policy.kyverno:
  probe: kubectl get crd clusterpolicies.kyverno.io >/dev/null 2>&1
storage.access-mode-mutation:
  probe: kubectl get clusterpolicy local-path-access-mode-mutation >/dev/null 2>&1
storage.default-class:
  probe: kubectl get storageclass -o json | jq -e '[.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"]=="true")] | length > 0' >/dev/null
certificates.cert-manager:
  probe: kubectl get crd certificates.cert-manager.io >/dev/null 2>&1
serving.kserve.crds:
  probe: kubectl get crd inferenceservices.serving.kserve.io >/dev/null 2>&1
serving.kserve:
  # The CRDs alone are not enough, aim-engine needs a running controller.
  probe: kubectl get crd inferenceservices.serving.kserve.io >/dev/null 2>&1 && kubectl get deployments -A -o name | grep -q kserve-controller-manager
inference.aim.crds:
  probe: kubectl get crd aimservices.aim.eai.amd.com >/dev/null 2>&1
inference.aim:
  # The CRDs alone are not enough, the catalog needs a running controller.
  probe: kubectl get crd aimservices.aim.eai.amd.com >/dev/null 2>&1 && kubectl get deployments -A -o name | grep -q aim-engine-controller-manager
catalog.aim:
  probe: kubectl get aimclustermodelsources.aim.eai.amd.com -o name 2>/dev/null | grep -q .
telemetry.otel.crds:
  probe: kubectl get crd opentelemetrycollectors.opentelemetry.io >/dev/null 2>&1
storage.s3.operator:
  probe: kubectl get crd seaweeds.seaweed.seaweedfs.com >/dev/null 2>&1
storage.s3:
  probe: kubectl get seaweed -A -o name 2>/dev/null | grep -q .
