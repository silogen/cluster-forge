# GPU smoke-test service for the scalable-inference-gpu profile. The image is
# public on Docker Hub. PULL_SECRET_JSON is optional: it lifts the Docker Hub
# rate limit of an anonymous pull.
#
# The AIM image holds the recipe, but the auto-made template asks for no GPU,
# and then the runtime finds no GPU and no compatible profile. spec.resources
# gives the GPU to the predictor.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: aim-llama-3-1-8b
  namespace: aims-test
spec:
  replicas: 1
  # local-path-provisioner gives ReadWriteOnce only, and Shared mode asks for
  # ReadWriteMany.
  caching:
    mode: Dedicated
  template:
    allowUnoptimized: true
  resources:
    requests:
      amd.com/gpu: "1"
    limits:
      amd.com/gpu: "1"
  imagePullSecrets:
    - name: aim-pull
  model:
    image: docker.io/amdenterpriseai/aim-meta-llama-llama-3-1-8b-instruct:0.8.5
