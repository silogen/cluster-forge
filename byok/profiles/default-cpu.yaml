# The reference profile on a cluster with no GPU. It gives one model endpoint
# served by aim-engine and KServe on CPU. The list order is the install order.
# The values block merges on top of the package values.yaml.
name: default-cpu
packages:
  # aim-engine 0.2.5 asks for ReadWriteMany cache volumes. A cluster whose
  # default StorageClass gives ReadWriteOnce only, for example
  # local-path-provisioner, needs this admission mutation. Take both packages
  # out when your default StorageClass gives ReadWriteMany.
  - name: kyverno
  - name: kyverno-policies-storage-local-path
  - name: cert-manager
  - name: kserve-crds
  - name: kserve
  - name: gateway-api-crds
  - name: aim-engine-crds
  - name: aim-engine
    values:
      aim-engine-chart:
        # The CPU detector reads /proc/cpuinfo and writes the accelerator of
        # every node as a node-feature-discovery label, for example
        # feature.node.kubernetes.io/aim-accelerator.EPYC_9004=1. Its image is
        # public on Docker Hub, so no pull secret is needed. Make the aim-pull
        # Secret only to lift the Docker Hub rate limit, and give it here:
        #   kubectl create secret docker-registry aim-pull -n aim-system \
        #     --docker-server=docker.io --docker-username=<user> \
        #     --docker-password=<token>
        acceleratorDetector:
          enable: true
          cpu:
            enable: true
  - name: aim-catalog
    values:
      aim-cluster-model-source:
        hardwareFamilies: [epyc]
