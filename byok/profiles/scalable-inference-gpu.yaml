# The reference profile on AMD Instinct GPUs. It gives one model endpoint
# served by aim-engine and KServe, with the AMD GPU operator under it.
#
# It does not extend scalable-inference: the list order is the install order,
# and a package that a child profile adds goes last. The GPU operator must
# install before aim-engine, because the accelerator detector of aim-engine
# reads the node labels that node-feature-discovery writes.
name: scalable-inference-gpu
packages:
  # aim-engine 0.2.5 asks for ReadWriteMany cache volumes. A cluster whose
  # default StorageClass gives ReadWriteOnce only, for example
  # local-path-provisioner, needs this admission mutation. Take both packages
  # out when your default StorageClass gives ReadWriteMany.
  - name: kyverno
  - name: kyverno-policies-storage-local-path
  - name: cert-manager
  # The node keeps its own ROCm driver: the DeviceConfig of the package holds
  # driver.enable false.
  - name: amd-gpu-operator
  - name: amd-gpu-operator-config
  - name: kserve-crds
  - name: kserve
  - name: gateway-api-crds
  - name: aim-engine-crds
  - name: aim-engine
    values:
      aim-engine-chart:
        # The detector reads the node-feature-discovery labels of the GPU
        # operator and writes the accelerator of every node. Its image comes
        # from amdenterpriseai, so make the aim-pull Secret in the aim-system
        # namespace before the install:
        #   kubectl create namespace aim-system
        #   kubectl create secret docker-registry aim-pull -n aim-system \
        #     --docker-server=docker.io --docker-username=<user> \
        #     --docker-password=<token>
        acceleratorDetector:
          enable: true
          gpu:
            imagePullSecrets:
              - name: aim-pull
          # The CPU detector has no node affinity, so it also runs on a GPU
          # node. There it reports model=CPU count=1 and its startup probe
          # never passes. A GPU profile does not need it.
          cpu:
            enable: false
  - name: aim-catalog
    values:
      aim-cluster-model-source:
        hardwareFamilies: [instinct]
