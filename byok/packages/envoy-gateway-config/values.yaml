envoy-gateway-config:
  # The HelmChartConfig object is RKE2 only.
  coreDns:
    enabled: false
  # cluster-bloom labels the first node. A foreign cluster has no such label.
  # null, not {}: helm keeps the chart default when a user value is an empty
  # map, and drops the key only for null.
  envoyProxy:
    nodeSelector: null
  # The kube API is reached with the kubeconfig, not through the gateway.
  k8sPassthrough:
    enabled: false
  gatewayDnsService:
    enabled: false
  aiGateway:
    enabled: false
