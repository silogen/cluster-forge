# Extra SecurityContextConstraints for the aim-system namespace.
#
# scc.yaml already grants anyuid to system:serviceaccounts:aim-system
# (ClusterRoleBinding anyuid-scc-aim-system). anyuid allows an arbitrary UID but
# NOT hostPath volumes, NOT privileged containers and NOT seccomp profiles, so
# the aim-engine accelerator-detector DaemonSets and the model discovery Jobs
# are rejected at admission and never create a pod at all:
#
#   daemonset/...-accelerator-detector-cpu   DESIRED 1  CURRENT 0  (466 x FailedCreate)
#   daemonset/...-accelerator-detector-gpu   DESIRED 1  CURRENT 0  (464 x FailedCreate)
#   Error creating: pods "..." is forbidden: unable to validate against any
#   security context constraint: ... hostPath volumes are not allowed to be used
#
# Both SCCs below are bound to named service accounts via users:, never to a
# group, so no other workload in the cluster can select them.
#
# priority is deliberately left unset. SCC selection then prefers the most
# restrictive constraint that can admit the pod, so these are only reached after
# restricted-v2 and anyuid have already failed to validate.
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: cf-aim-engine-detector-scc
  annotations:
    kubernetes.io/description: >-
      Lets the aim-engine accelerator-detector DaemonSets mount host paths and,
      for the GPU variant, run privileged. Bound to one service account.
# Required by both DaemonSets:
#   /etc/kubernetes/node-feature-discovery/features.d/  writes NFD feature files
#   /proc/cpuinfo                                       cpu variant
#   /dev/kfd, /dev/dri                                  gpu variant
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
# gpu variant sets containers[0].securityContext.privileged: true so it can
# reach /dev/kfd and /dev/dri
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
# Neither pod adds a capability: the cpu detector drops ALL itself and the gpu
# detector relies on privileged, so nothing needs to be granted or forced.
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities: []
readOnlyRootFilesystem: false
# initContainer prep-features-dir runs as 0, detector container as 65534
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - '*'
userNamespaceLevel: AllowHostLevel
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - persistentVolumeClaim
  - projected
  - secret
groups: []
users:
  - system:serviceaccount:aim-system:aim-engine-aim-engine-chart-accelerator-detector
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: cf-aim-engine-discovery-scc
  annotations:
    kubernetes.io/description: >-
      Lets the aim-engine model discovery Jobs set a seccomp profile and run as
      UID 65532. No host access of any kind.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: false
# pods set runAsUser 65532, outside the namespace-allocated UID range
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
# pods set securityContext.seccompProfile.type: RuntimeDefault, which anyuid
# rejects with "metadata.annotations[seccomp...]: Forbidden: seccomp may not be set"
seccompProfiles:
  - runtime/default
userNamespaceLevel: AllowHostLevel
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
groups: []
# the discovery Jobs run under the namespace default service account
users:
  - system:serviceaccount:aim-system:default
