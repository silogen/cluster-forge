# =============================================================================
# Extra Kyverno policies for OpenShift
# =============================================================================
# Everything install-old.sh applies in STEP 9, in one file because it is one apply:
# a single `ssa_apply` in source order. Document order is therefore load-bearing
# — each RBAC ClusterRole must precede the policy that depends on it, or Kyverno
# rejects the policy at admission.
#
#   1. generate-scc-on-namespaces        per-project SCC for labelled Namespaces
#   2. RBAC: routes                      lets Kyverno manage OpenShift Routes
#   3. generate-routes-from-httproutes   HTTPRoute -> Route (non-rewrite)
#   4. ...-rewrite                       HTTPRoute -> Route (URLRewrite variant)
#   5. RBAC: sccs (cleanup controller)   lets the cleanup controller delete SCCs
#   6. cleanup-orphaned-sccs             GC for the SCCs generated by (1)
#
# The RBAC for (1) is not here: it is the kyverno-scc-generator ClusterRole in
# extra/scc.yaml, applied back in STEP 2.
#
# NOTE: the two HTTPRoute policies use the <DOMAIN> placeholder, substituted at
# apply time. No other document in this file contains it. To apply by hand:
#   sed 's|<DOMAIN>|apps.<cluster>.example.com|g' 05-kyverno.yaml | kubectl apply --server-side -f -

# -----------------------------------------------------------------------------
# 1. generate-scc-on-namespaces
# -----------------------------------------------------------------------------
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-scc-on-namespaces
spec:
  rules:
  - name: generate-scc-on-namespaces-rule
    match:
      any:
      - resources:
          kinds:
            - Namespace
          selector:
            matchExpressions:
              - key: airm.silogen.ai/project-id # Only airm business logics will be applied
                operator: Exists
    generate:
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      name: "cf-{{request.object.metadata.name}}-scc"
      synchronize: true
      data:
        metadata:
          name: "cf-{{request.object.metadata.name}}-scc"
        priority: 20
        allowPrivilegedContainer: false
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        runAsUser:
          type: RunAsAny
        seLinuxContext:
          type: RunAsAny
        fsGroup:
          type: RunAsAny
        supplementalGroups:
          type: RunAsAny
        seccompProfiles:
          - runtime/default
        requiredDropCapabilities: []
        allowedCapabilities:
          - SETUID
          - SETGID
        defaultAddCapabilities:
          - SETUID
          - SETGID
        volumes:
          - configMap
          - downwardAPI
          - emptyDir
          - ephemeral
          - persistentVolumeClaim
          - projected
          - secret
        users:
          - "system:serviceaccount:{{request.object.metadata.name}}:default"

# -----------------------------------------------------------------------------
# 2. RBAC: let Kyverno manage OpenShift Routes
# -----------------------------------------------------------------------------
---
# Grants the Kyverno admission controller list/get on Routes so the
# validate-policy.kyverno.svc webhook accepts ClusterPolicies that
# reference route.openshift.io Routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:additional:admission-controller:routes
  labels:
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]

---
# Grants the Kyverno background controller the permissions it needs to
# actually generate, sync and clean up Routes created by the
# generate-routes-from-httproutes ClusterPolicy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:additional:background-controller:routes
  labels:
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # OpenShift gates `spec.host` on Routes behind a virtual `routes/custom-host`
  # subresource. Without this, generated Routes are rejected by the OpenShift
  # route admission plugin with: "spec.host: Forbidden: you do not have
  # permission to set the host field of the route".
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create", "update"]
# -----------------------------------------------------------------------------
# 3. generate-routes-from-httproutes (non-rewrite)
# -----------------------------------------------------------------------------
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-routes-from-httproutes
  annotations:
    policies.kyverno.io/title: Generate Routes from HTTPRoutes
    policies.kyverno.io/category: Generation
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      This policy automatically generates OpenShift Routes when Gateway API 
      HTTPRoutes with airm.silogen.ai/workload-id label are created.
spec:
  rules:
  - name: generate-route-rule
    match:
      any:
      - resources:
          kinds:
          - HTTPRoute
          selector:
            matchExpressions:
            - key: airm.silogen.ai/workload-id
              operator: Exists
    # Skip HTTPRoutes that ask for a path rewrite — those are handled
    # by `generate-routes-from-httproutes-rewrite`, which adds the
    # haproxy `rewrite-target: /` annotation. Dispatching by the
    # `URLRewrite` filter (an intrinsic property of the HTTPRoute)
    # instead of by name keeps this generic for any workload type
    # (mlflow, vscode, jupyter, ...).
    preconditions:
      all:
      - key: "{{ length(request.object.spec.rules[].filters[?type=='URLRewrite'][]) }}"
        operator: Equals
        value: 0
    generate:
      # Keep generated Routes in sync with their source HTTPRoute, and let
      # the background controller self-heal if Kyverno's admission webhook
      # was unavailable when the HTTPRoute was created/updated.
      synchronize: true
      apiVersion: route.openshift.io/v1
      kind: Route
      name: "{{request.object.metadata.name}}"
      namespace: "{{request.object.metadata.namespace}}"
      data:
        metadata:
          name: "{{request.object.metadata.name}}"
          namespace: "{{request.object.metadata.namespace}}"
          annotations:
            # A Route has no field equivalent to the HTTPRoute's
            # spec.rules[].timeouts.request, so without this the generated Route
            # silently falls back to the router default of 30s and long-running
            # requests die with a 504. AIM sets "30m0s" on its HTTPRoutes, but
            # haproxy rejects compound Go durations and drops the annotation
            # without logging, so emit the normalised equivalent instead of
            # copying the source value.
            haproxy.router.openshift.io/timeout: 30m
        spec:
          # Mirror the source HTTPRoute's own hostname onto the generated Route
          # (AIWB sets exactly one, e.g. workspaces.<DOMAIN>) so the Route serves
          # the exact URL the AIWB app advertises. Do NOT hard-code a host here:
          # hard-coding aiwbui.<DOMAIN> produced Routes on the wrong host and made
          # the advertised workspace links 503.
          host: "{{ request.object.spec.hostnames[0] }}"
          path: "{{request.object.spec.rules[0].matches[0].path.value}}"
          to:
            kind: Service
            name: "{{request.object.spec.rules[0].backendRefs[0].name}}"
            weight: 100
          port:
            targetPort: http
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
          wildcardPolicy: None
# -----------------------------------------------------------------------------
# 4. generate-routes-from-httproutes-rewrite
# -----------------------------------------------------------------------------
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  # Distinct name from the non-rewrite policy so both can co-exist;
  # otherwise `kubectl apply -f` of both files silently overwrites one.
  name: generate-routes-from-httproutes-rewrite
  annotations:
    policies.kyverno.io/title: Generate Rewrite Routes from HTTPRoutes
    policies.kyverno.io/category: Generation
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      Generates an OpenShift Route with the haproxy
      `rewrite-target: /` annotation when an AIRM-owned Gateway API
      HTTPRoute has a `URLRewrite` filter — i.e. the source HTTPRoute
      strips its long path prefix before forwarding to the backend, so
      the OpenShift router must do the same. Mutually exclusive with
      `generate-routes-from-httproutes` (which handles the no-rewrite
      case) via opposite preconditions on the URLRewrite filter.
spec:
  rules:
  - name: generate-route-rule
    match:
      any:
      - resources:
          kinds:
          - HTTPRoute
          selector:
            matchExpressions:
            - key: airm.silogen.ai/workload-id
              operator: Exists
    # Only fire when the source HTTPRoute requests a path rewrite.
    # Mutually exclusive with `generate-routes-from-httproutes`.
    preconditions:
      all:
      - key: "{{ length(request.object.spec.rules[].filters[?type=='URLRewrite'][]) }}"
        operator: GreaterThanOrEquals
        value: 1
    generate:
      # Keep generated Routes in sync with their source HTTPRoute, and let
      # the background controller self-heal if Kyverno's admission webhook
      # was unavailable when the HTTPRoute was created/updated.
      synchronize: true
      apiVersion: route.openshift.io/v1
      kind: Route
      name: "{{request.object.metadata.name}}"
      namespace: "{{request.object.metadata.namespace}}"
      data:
        metadata:
          name: "{{request.object.metadata.name}}"
          namespace: "{{request.object.metadata.namespace}}"
          annotations:
            haproxy.router.openshift.io/rewrite-target: /
            # A Route has no field equivalent to the HTTPRoute's
            # spec.rules[].timeouts.request, so without this the generated Route
            # silently falls back to the router default of 30s and long inference
            # requests die with a 504. AIM sets "30m0s" on its HTTPRoutes, but
            # haproxy rejects compound Go durations and drops the annotation
            # without logging, so emit the normalised equivalent instead of
            # copying the source value.
            haproxy.router.openshift.io/timeout: 30m
        spec:
          # Mirror the source HTTPRoute's own hostname onto the generated Route
          # (AIWB sets exactly one, e.g. workspaces.<DOMAIN>) so the Route serves
          # the exact URL the AIWB app advertises. Do NOT hard-code a host here:
          # hard-coding aiwbui.<DOMAIN> produced Routes on the wrong host and made
          # the advertised workspace links 503.
          host: "{{ request.object.spec.hostnames[0] }}"
          path: "{{request.object.spec.rules[0].matches[0].path.value}}"
          to:
            kind: Service
            name: "{{request.object.spec.rules[0].backendRefs[0].name}}"
            weight: 100
          port:
            targetPort: http
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
          wildcardPolicy: None

# -----------------------------------------------------------------------------
# 5. RBAC: let the Kyverno cleanup controller delete SCCs
# -----------------------------------------------------------------------------
---
# Grants the Kyverno cleanup controller permission to delete SCCs.
#
# The cleanup-controller.kyverno.svc webhook validates a ClusterCleanupPolicy
# at admission time by checking that the cleanup controller's ServiceAccount
# can delete every kind the policy matches. Without this ClusterRole the
# cleanup-orphaned-sccs policy is rejected with:
#   "cleanup controller has no permission to delete kind SecurityContextConstraints"
#
# Must be applied BEFORE the cleanup-orphaned-sccs policy, hence its position
# immediately above it in this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:additional:cleanup-controller:sccs
  labels:
    app.kubernetes.io/component: cleanup-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["get", "list", "watch", "delete"]

# -----------------------------------------------------------------------------
# 6. cleanup-orphaned-sccs
# -----------------------------------------------------------------------------
---
# Pre-fetch every Namespace once into Kyverno's global context, list-watch
# style. Without this, the cleanup policy would have to look up the
# source namespace per SCC via `context.apiCall`, but Kyverno caches
# `apiCall` results across all matched resources in a single tick — i.e.
# it fires the apiCall once with the FIRST SCC's namespace name and
# reuses that result for every other SCC. That makes per-resource
# orphan detection impossible (and is actively dangerous: depending on
# iteration order, a stale cached "ns gone" result can cause healthy
# SCCs to be deleted by mistake). A `globalReference` is JMESPath-
# filtered per-resource, so each SCC gets its own correct lookup.
apiVersion: kyverno.io/v2alpha1
kind: GlobalContextEntry
metadata:
  name: namespaces
spec:
  kubernetesResource:
    group: ""
    version: v1
    resource: namespaces
---
apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-orphaned-sccs
  annotations:
    policies.kyverno.io/title: Cleanup Orphaned SCCs
    policies.kyverno.io/category: Cleanup
    policies.kyverno.io/subject: SecurityContextConstraints
    policies.kyverno.io/description: >-
      Removes orphaned SecurityContextConstraints generated by the
      `generate-scc-on-namespaces` policy when their source namespace is
      gone or has been recreated with a different UID since the SCC was
      generated.
spec:
  schedule: "*/1 * * * *"
  match:
    any:
    - resources:
        kinds:
        - SecurityContextConstraints
        selector:
          matchLabels:
            app.kubernetes.io/managed-by: kyverno
            # Must equal the GENERATING ClusterPolicy's name exactly -- Kyverno
            # derives this label from it. It read "-activity" here while the
            # policy in section 1 of this file is plain
            # generate-scc-on-namespaces, so the selector matched nothing and
            # the cleanup ran every minute against an empty candidate list.
            generate.kyverno.io/policy-name: generate-scc-on-namespaces
  context:
  - name: namespacesList
    globalReference:
      name: namespaces
      jmesPath: "@"
  conditions:
    all:
    # Single condition that resolves the source namespace's CURRENT UID
    # via the globalReference (or 'GONE' if the namespace has been
    # deleted) and compares it to the UID the SCC was generated for.
    # NotEquals handles both cases:
    #   - namespace gone     -> 'GONE'        != trig-uid -> delete
    #   - namespace recreated -> new-uid      != trig-uid -> delete
    #   - namespace unchanged -> trig-uid     == trig-uid -> keep
    #
    # IMPORTANT — gotchas baked into this single condition:
    #
    # 1. The matched resource is bound to `target` (NOT `request.object`,
    #    which is admission-only and silently resolves to empty here —
    #    that was the original bug that made this policy a no-op).
    #
    # 2. `split` is a 2-arg function in Kyverno JMESPath:
    #    `split(s, sep)`. The pipe form `s | split(sep)` silently
    #    produces nothing (no error logged).
    #
    # 3. We deliberately do NOT split this into two conditions
    #    (e.g. a `starts_with` sanity check + the orphan check). Kyverno
    #    only loads `context.globalReference` for the FIRST condition
    #    that references it; if a context-free condition is listed
    #    earlier, the context-using condition gets silently skipped.
    - key: '{{ namespacesList[?metadata.name == ''{{ split(target.users[0], '':'')[2] }}''].metadata.uid | [0] || ''GONE'' }}'
      operator: NotEquals
      value: '{{ target.metadata.labels."generate.kyverno.io/trigger-uid" }}'
