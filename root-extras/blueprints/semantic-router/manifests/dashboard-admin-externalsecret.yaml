# Sync wave -1, so this object is applied before the dashboard pod.
# openbao-config defines the four OpenBao paths.
# Copy this file to extra-apps/semantic-router/manifests/ only for dashboard way 2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: semantic-router-dashboard-admin
  namespace: semantic-router
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-secret-store
  target:
    creationPolicy: Owner
    name: semantic-router-dashboard-admin
  data:
    - secretKey: email
      remoteRef:
        key: semantic-router-dashboard-admin-email
        property: value
    - secretKey: name
      remoteRef:
        key: semantic-router-dashboard-admin-name
        property: value
    - secretKey: password
      remoteRef:
        key: semantic-router-dashboard-admin-password
        property: value
    - secretKey: jwt-secret
      remoteRef:
        key: semantic-router-dashboard-jwt-secret
        property: value
