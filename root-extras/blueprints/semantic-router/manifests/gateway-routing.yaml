# Gateway resources for one semantic-router deployment.
# Copy this file to extra-apps/semantic-router/manifests/ in the overlay repo.
# ArgoCD applies these manifests directly. Replace each TODO first.
# The shared HTTPS Gateway forwards traffic to the dedicated sr-gateway.
# Envoy calls semantic-router over ext_proc, then routes to the selected backend.
# The SecurityPolicy requires an API key. llmRequestCosts enables token quotas.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Keep this name distinct from AIGatewayRoute/semantic-router. The controller
  # overwrites an HTTPRoute that has the same name and namespace as an AIGatewayRoute.
  name: semantic-router-gateway
  namespace: semantic-router
spec:
  # Attach to the shared HTTPS Gateway.
  parentRefs:
    - name: https
      namespace: envoy-gateway-system
  hostnames:
    # TODO: your own subdomain, on this cluster's domain.
    - sr.mycluster.example.com
  rules:
    # Strip caller-controlled routing and identity headers before forwarding.
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-api-key-id
              - x-selected-model
              - x-ai-eg-model
              - x-ai-eg-backend
      backendRefs:
        - name: sr-gateway
          namespace: envoy-gateway-system
          port: 8080
      timeouts:
        # Matches sr-gateway-extproc.yaml's messageTimeout and the
        # AIGatewayRoute's own request budget below — this hop must not time
        # out before either of those does, or a real completion gets cut here
        # instead of failing cleanly downstream.
        request: 300s
        backendRequest: 300s
---
# Token counts (llm_input_token/llm_output_token/llm_total_token) land in
# io.envoy.ai_gateway dynamic metadata ONLY because of llmRequestCosts here —
# nothing else populates it. sr-gateway-proxy-config.yaml's access log reads
# these same keys, and quota.yaml's QuotaPolicy charges against them.
#
# Create the Gateway before this route. After sync, confirm the generated
# HTTPRoute is Accepted and has resolved references.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: semantic-router
  namespace: semantic-router
spec:
  parentRefs:
    - name: sr-gateway
      namespace: semantic-router
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
  rules:
    # Add one rule per model in values.yaml. Match x-selected-model, set by the
    # router's ext_proc after it classifies the request.
    - matches:
        - headers:
            - name: x-selected-model
              value: TODO-your-model
      backendRefs:
        - name: TODO-your-model-backend
          # The backend model name must match quota.yaml's modelName.
          modelNameOverride: TODO-your-backend-model
      timeouts:
        request: 300s
        backendRequest: 300s
    # Keep the catch-all last. Envoy needs a match before ext_proc runs.
    # Requests land here if the router does not select a model. Use an
    # intentional default backend.
    - backendRefs:
        - name: TODO-your-model-backend
          modelNameOverride: TODO-your-backend-model
      timeouts:
        request: 300s
        backendRequest: 300s
---
# Declare each upstream with an AIServiceBackend and Backend pair.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: TODO-your-model-backend
  namespace: semantic-router
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: TODO-your-model-backend
---
# AIServiceBackend references an Envoy Gateway Backend. Use the Service's FQDN
# and namespace in the Backend endpoint. This does not need a ReferenceGrant.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: TODO-your-model-backend
  namespace: semantic-router
spec:
  endpoints:
    - fqdn:
        hostname: TODO-your-vllm-service.TODO-your-vllm-namespace.svc.cluster.local
        port: 8000
---
# Require an API key before the request reaches the router or backend.
# This Gateway carries one route, so Gateway-level policy has narrow scope.
# Do not add `authorization: {defaultAction: Deny}` without an Allow rule; that
# denies authenticated requests too.
#
# `forwardClientIDHeader` sets x-api-key-id to the matching Secret key name.
# QuotaPolicy uses this value as the client bucket key. Keep key names unique.
# `sanitize: true` removes Authorization before forwarding the request.
#
# Store this Secret directly in the cluster, not in the overlay repo:
#
#   kubectl -n semantic-router create secret generic semantic-router-client-keys \
#     --from-literal=TODO-your-client-name="$(openssl rand -hex 32)"
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: semantic-router-apikey
  namespace: semantic-router
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sr-gateway
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: semantic-router-client-keys
    extractFrom:
      - headers:
          - Authorization
    forwardClientIDHeader: x-api-key-id
    sanitize: true

# Optional retry policy for connection failures. Confirm Envoy Gateway accepts
# AIGatewayRoute as its target before enabling this example.
#
# ---
# apiVersion: gateway.envoyproxy.io/v1alpha1
# kind: BackendTrafficPolicy
# metadata:
#   name: semantic-router-retry
#   namespace: semantic-router
# spec:
#   targetRefs:
#     - group: aigateway.envoyproxy.io
#       kind: AIGatewayRoute
#       name: semantic-router
#   retry:
#     numRetries: 2
#     retryOn:
#       triggers:
#         - connect-failure
#         - refused-stream
#         - reset-before-request
#     perRetry:
#       backOff:
#         baseInterval: 1s
#         maxInterval: 5s

# Traffic splitting sends weighted traffic to independent deployments. It is
# not failover. Configure health checks or outlier detection for failover.
#
#     - matches:
#         - headers:
#             - name: x-selected-model
#               value: TODO-your-model
#       backendRefs:
#         - name: TODO-your-primary-model-backend
#           weight: 90
#         - name: TODO-your-secondary-model-backend
#           weight: 10

# External providers use the same AIServiceBackend and Backend resources.
# Set the Backend FQDN and schema.name for the provider. Configure TLS and
# provider authentication as required.
#
# All objects below are commented out. Uncomment and edit if you need them,
# then reference the AIServiceBackend from a rule in the AIGatewayRoute above:
#
#     - matches:
#         - headers:
#             - name: x-selected-model
#               value: gpt-4o
#       backendRefs:
#         - name: openai
#
# The router does not need to reach the API itself — it only classifies and
# names a model. Envoy makes the upstream call.
#
# Authentication is yours to arrange. Nothing here injects an API key, so a
# client-supplied `Authorization` header passes through to the provider as-is
# unless overridden. If the key should live in the cluster instead, that needs
# a mechanism this blueprint does not set up.
#
# ---
# apiVersion: aigateway.envoyproxy.io/v1beta1
# kind: AIServiceBackend
# metadata:
#   name: openai
#   namespace: semantic-router
# spec:
#   schema:
#     name: OpenAI
#   backendRef:
#     group: gateway.envoyproxy.io
#     kind: Backend
#     name: openai
# ---
# apiVersion: gateway.envoyproxy.io/v1alpha1
# kind: Backend
# metadata:
#   name: openai
#   namespace: semantic-router
# spec:
#   endpoints:
#     - fqdn:
#         hostname: api.openai.com
#         port: 443
# ---
# # Without this Envoy talks plaintext to port 443 and every request fails. It
# # also supplies the SNI name and verifies the provider's certificate against
# # the system trust store.
# apiVersion: gateway.networking.k8s.io/v1
# kind: BackendTLSPolicy
# metadata:
#   name: openai-tls
#   namespace: semantic-router
# spec:
#   targetRefs:
#     - group: gateway.envoyproxy.io
#       kind: Backend
#       name: openai
#   validation:
#     wellKnownCACertificates: System
#     hostname: api.openai.com
#
# Same pattern for an Anthropic upstream (api_format: anthropic in
# values.yaml, see the README) — same three objects, different hostname and
# schema.name:
#
# ---
# apiVersion: aigateway.envoyproxy.io/v1beta1
# kind: AIServiceBackend
# metadata:
#   name: anthropic
#   namespace: semantic-router
# spec:
#   schema:
#     name: Anthropic
#   backendRef:
#     group: gateway.envoyproxy.io
#     kind: Backend
#     name: anthropic
# ---
# apiVersion: gateway.envoyproxy.io/v1alpha1
# kind: Backend
# metadata:
#   name: anthropic
#   namespace: semantic-router
# spec:
#   endpoints:
#     - fqdn:
#         hostname: api.anthropic.com
#         port: 443
# ---
# apiVersion: gateway.networking.k8s.io/v1
# kind: BackendTLSPolicy
# metadata:
#   name: anthropic-tls
#   namespace: semantic-router
# spec:
#   targetRefs:
#     - group: gateway.envoyproxy.io
#       kind: Backend
#       name: anthropic
#   validation:
#     wellKnownCACertificates: System
#     hostname: api.anthropic.com
