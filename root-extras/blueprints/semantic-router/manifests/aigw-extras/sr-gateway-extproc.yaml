# One Gateway policy carries metric-hygiene Lua and semantic-router ext_proc.
# The Lua runs before api_key_auth and ext_proc. It removes client-supplied
# routing headers so fail-open requests cannot select a backend directly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: sr-gateway-extproc
  namespace: semantic-router
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sr-gateway
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          request_handle:headers():remove("x-selected-model")
          local be = request_handle:headers():get("x-ai-eg-backend")
          if be ~= nil and be:match("^%x%x%x%x%x%x%x%x%-%x%x%x%x%-%x%x%x%x%-%x%x%x%x%-%x%x%x%x%x%x%x%x%x%x%x%x$") == nil then
            request_handle:headers():remove("x-ai-eg-backend")
          end
        end
  extProc:
    - backendRefs:
        # Same namespace as this policy, so no ReferenceGrant is needed.
        - kind: Service
          name: semantic-router
          port: 50051
      processingMode:
        request:
          # The router classifies on the prompt, so it needs the body. Without
          # this it is sent headers only and every request takes the catch-all.
          body: Buffered
        # Response processing deliberately left off -- see gateway-routing.yaml's
        # original comment: body: Buffered here would hold the whole completion
        # before returning it, breaking token streaming.
      # Budget includes request buffering and model classification.
      messageTimeout: 300s
      # Router unreachable -> requests skip it and take the catch-all rule,
      # instead of the whole hostname returning 5xx.
      failOpen: true
