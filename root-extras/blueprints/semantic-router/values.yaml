# scripts/setup.sh copies this file to extra-apps/semantic-router/values.yaml.
# Argo CD reads that copy as plain YAML, so write the cluster domain literally.

persistence:
  # Empty string omits the field. The cluster default StorageClass applies.
  # "-" stores an explicit empty class, and the PVC stays Pending.
  storageClassName: ""

image:
  # Same commit as targetRevision in extraApps.yaml. Config schema is v0.5.
  tag: "9968ac62a50aa0f79385b079f59170906d849a0c"

# Bind the management API on all interfaces so the dashboard pod can reach port 8080.
# No Gateway route publishes this port.
extraEnv:
  - name: VLLM_SR_MANAGEMENT_INTERNAL_LISTENER
    value: "true"

dashboard:
  enabled: true
  image:
    tag: "9968ac62a50aa0f79385b079f59170906d849a0c"

  # Keeps the admin account, evaluation runs, and workflows across pod restarts.
  persistence:
    enabled: true
    storageClassName: ""

  # The public first-admin form stays closed. Startup creates the admin from
  # Secret semantic-router-dashboard-admin. See the README.
  allowOpenBootstrap: false

  # Stable session signing key. Without this, every pod start logs everyone out.
  jwtSecret:
    existingSecret: semantic-router-dashboard-admin
    existingSecretKey: jwt-secret

  extraEnv:
    - name: DASHBOARD_ADMIN_EMAIL
      valueFrom:
        secretKeyRef:
          name: semantic-router-dashboard-admin
          key: email
    - name: DASHBOARD_ADMIN_NAME
      valueFrom:
        secretKeyRef:
          name: semantic-router-dashboard-admin
          key: name
    - name: DASHBOARD_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: semantic-router-dashboard-admin
          key: password

  httpRoute:
    enabled: true
    # TODO: your own subdomain, on this cluster's domain.
    hostname: sr-dashboard.mycluster.example.com
    # The shared Gateway every app on a bloomed cluster routes through.
    parentRef:
      name: https
      namespace: envoy-gateway-system

# Schema v0.5. Decisions live under recipes.
# Repeat the model name in each list. Helm replaces a list.
config:
  version: v0.5
  # Required together with VLLM_SR_MANAGEMENT_INTERNAL_LISTENER.
  global:
    services:
      management_api:
        bind_address: "0.0.0.0"
  providers:
    defaults:
      model: "TODO-your-model"
    models:
      - name: "TODO-your-model"
        # The ID the backend itself expects, which may differ from the name above.
        provider_model_id: "TODO-your-model"
        backend_refs:
          - name: "primary"
            provider: vllm
            # TODO: your vLLM service, e.g. my-vllm.my-namespace.svc:8000
            endpoint: "TODO-your-vllm-service:8000"
            protocol: "http"
            weight: 100
  recipes:
    - name: default
      signals:
        domains:
          - name: "general"
            description: "Catch-all domain"
            labels: ["other"]
      decisions:
        - name: "default-route"
          description: "Catch-all route. Add decisions after a backend is connected."
          priority: 100
          rules:
            operator: "AND"
            conditions: []
          modelRefs:
            - model: "TODO-your-model"
              use_reasoning: false
