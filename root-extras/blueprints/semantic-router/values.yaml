# setup.sh copies this file to extra-apps/semantic-router/values.yaml.
# Edit models.small, models.medium, and models.large. Leave the alias lines in config.
# Anchors copy each id and endpoint into config. The gateway chart reads the same entries.

persistence:
  # Empty string omits the field. The cluster default StorageClass applies.
  # "-" stores an explicit empty class, and the PVC stays Pending.
  storageClassName: ""

image:
  # Same commit as targetRevision in extraApps.yaml. Config schema is v0.5.
  tag: "9968ac62a50aa0f79385b079f59170906d849a0c"

# Bind the management API on all interfaces so the dashboard pod can reach port 8080.
# No Gateway route publishes this port.
extraEnv:
  - name: VLLM_SR_MANAGEMENT_INTERNAL_LISTENER
    value: "true"

dashboard:
  enabled: true
  image:
    tag: "9968ac62a50aa0f79385b079f59170906d849a0c"

  # Keeps the admin account, evaluation runs, and workflows across pod restarts.
  persistence:
    enabled: true
    storageClassName: ""

  # The public first-admin form stays closed.
  allowOpenBootstrap: false

  # Uncomment jwtSecret and extraEnv after Secret semantic-router-dashboard-admin exists.
  # With those keys set and the Secret absent, the dashboard pod stays in CreateContainerConfigError.
  # jwtSecret:
  #   existingSecret: semantic-router-dashboard-admin
  #   existingSecretKey: jwt-secret
  # extraEnv:
  #   - name: DASHBOARD_ADMIN_EMAIL
  #     valueFrom:
  #       secretKeyRef:
  #         name: semantic-router-dashboard-admin
  #         key: email
  #   - name: DASHBOARD_ADMIN_NAME
  #     valueFrom:
  #       secretKeyRef:
  #         name: semantic-router-dashboard-admin
  #         key: name
  #   - name: DASHBOARD_ADMIN_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: semantic-router-dashboard-admin
  #         key: password

  httpRoute:
    enabled: true
    # TODO: your own subdomain, on this cluster's domain.
    hostname: sr-dashboard.mycluster.example.com
    # The shared Gateway every app on a bloomed cluster routes through.
    parentRef:
      name: https
      namespace: envoy-gateway-system

# aigw uses the AI Gateway CRDs. envoy sends each model to its Service.
routing:
  mode: aigw
  hostname: sr.mycluster.example.com
  # The shared Gateway that serves the router hostname.
  parentRef:
    name: https
    namespace: envoy-gateway-system
  # GatewayClass of the router's own Gateway. Used when mode is aigw.
  gatewayClassName: envoy-gateway

# Set enabled to true to render QuotaPolicy. Requires routing.mode aigw.
# shadowMode true counts requests and rejects none.
quota:
  enabled: false
  shadowMode: true
  limit: 100000
  duration: 1h

# The three ids must differ. endpoint is <service>.<namespace>.svc.cluster.local:<port>.
models:
  small:
    id: &modelSmall "TODO-small-model"
    endpoint: &endpointSmall "TODO-your-vllm-service.TODO-your-vllm-namespace.svc.cluster.local:8000"
  medium:
    id: &modelMedium "TODO-medium-model"
    endpoint: &endpointMedium "TODO-your-vllm-service.TODO-your-vllm-namespace.svc.cluster.local:8000"
  large:
    id: &modelLarge "TODO-large-model"
    endpoint: &endpointLarge "TODO-your-vllm-service.TODO-your-vllm-namespace.svc.cluster.local:8000"

# Schema v0.5. Decisions live under recipes.
# Easy prompts use the small model. Hard prompts use the large model.
# Every other prompt uses the medium model.
config:
  version: v0.5
  # Required together with VLLM_SR_MANAGEMENT_INTERNAL_LISTENER.
  global:
    services:
      management_api:
        bind_address: "0.0.0.0"
  providers:
    defaults:
      model: *modelMedium
    models:
      - name: *modelSmall
        provider_model_id: *modelSmall
        backend_refs:
          - name: "primary"
            provider: vllm
            endpoint: *endpointSmall
            protocol: "http"
            weight: 100
      - name: *modelMedium
        provider_model_id: *modelMedium
        backend_refs:
          - name: "primary"
            provider: vllm
            endpoint: *endpointMedium
            protocol: "http"
            weight: 100
      - name: *modelLarge
        provider_model_id: *modelLarge
        backend_refs:
          - name: "primary"
            provider: vllm
            endpoint: *endpointLarge
            protocol: "http"
            weight: 100
  recipes:
    - name: default
      signals:
        complexity:
          - name: task-complexity
            description: "Distinguish simple factual queries from complex reasoning tasks."
      decisions:
        - name: "hard-to-large"
          description: "Hard prompts use the large model."
          priority: 200
          rules:
            operator: "AND"
            conditions:
              - type: "complexity"
                name: "task-complexity"
                label: "hard"
          modelRefs:
            - model: *modelLarge
              use_reasoning: false
        - name: "easy-to-small"
          description: "Easy prompts use the small model."
          priority: 150
          rules:
            operator: "AND"
            conditions:
              - type: "complexity"
                name: "task-complexity"
                label: "easy"
          modelRefs:
            - model: *modelSmall
              use_reasoning: false
        - name: "default-route"
          description: "Catch-all route. Other prompts use the medium model."
          priority: 100
          rules:
            operator: "AND"
            conditions: []
          modelRefs:
            - model: *modelMedium
              use_reasoning: false
