{{- if and (eq .Values.routing.mode "aigw") .Values.quota.enabled }}
# shadowMode stays on. This controller counts requests for a Distinct client bucket.
# Leave token limits unset until that build counts tokens.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: semantic-router
  namespace: semantic-router
spec:
  targetRefs:
    {{- range $tier := list "small" "medium" "large" }}
    {{- $model := index $.Values.models $tier }}
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: {{ include "semantic-router-gateway.backendName" $model.id }}
    {{- end }}
  perModelQuotas:
    {{- range $tier := list "small" "medium" "large" }}
    {{- $model := index $.Values.models $tier }}
    - modelName: {{ $model.id | quote }}
      quota:
        mode: Shared
        bucketRules:
          - shadowMode: true
            clientSelectors:
              - headers:
                  - name: x-api-key-id
                    type: Distinct
            quota:
              limit: {{ $.Values.quota.limit }}
              duration: {{ $.Values.quota.duration }}
    {{- end }}
{{- end }}
