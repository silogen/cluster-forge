# Argo CD Application for semantic-router.
# scripts/setup.sh merges this key into extra-apps-values.yaml.

extraApps:
  semantic-router:
    project: default
    sources:
      - repoURL: https://github.com/vllm-project/semantic-router.git
        path: deploy/helm/semantic-router
        # Config schema v0.5. values.yaml pins both image tags to this commit.
        targetRevision: "9968ac62a50aa0f79385b079f59170906d849a0c"
        helm:
          valueFiles:
            - $cluster-values/extra-apps/semantic-router/values.yaml
      # Gateway chart. It reads the same values file as the router chart.
      # An empty chart path fails the sync.
      - repoURL: "{{ .Values.externalValues.repoUrl }}"
        targetRevision: "{{ .Values.externalValues.targetRevision }}"
        path: extra-apps/semantic-router/chart
        helm:
          valueFiles:
            - $cluster-values/extra-apps/semantic-router/values.yaml
      # The overlay repo the $cluster-values alias above resolves against.
      # externalValues is forwarded by cluster-forge-extras, so this needs no
      # editing.
      - repoURL: "{{ .Values.externalValues.repoUrl }}"
        targetRevision: "{{ .Values.externalValues.targetRevision }}"
        ref: cluster-values
    destination:
      server: https://kubernetes.default.svc
      namespace: semantic-router
    # ESO fills in default values for these fields. Dashboard way 2 tracks the
    # ExternalSecret, so Argo CD would show OutOfSync without this entry.
    ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - ".spec.data[].remoteRef.conversionStrategy"
          - ".spec.data[].remoteRef.decodingStrategy"
          - ".spec.data[].remoteRef.metadataPolicy"
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
