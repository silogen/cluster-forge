# Example add-on. NOT loaded automatically by any Application, and not a real
# component — just a template to copy and adapt.
#
# extraApps.<name> is the literal ArgoCD Application `spec:` block, written
# exactly as you'd write it by hand. Copy this block into the cluster-values
# overlay repo's extra-apps-values.yaml, rename it, and point `source` at your
# own chart/manifests (see docs/adding_extra_components.md).

extraApps:
  example-app:
    project: default
    source:
      repoURL: https://example.com/some-org/some-chart.git
      path: charts/example-app
      targetRevision: v1.0.0
      helm:
        values: |
          replicaCount: 1
          ingress:
            enabled: true
            hostname: "example-app.{{ .Values.global.domain }}"
    destination:
      server: https://kubernetes.default.svc
      namespace: example-app
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true

  # Same idea, but the chart values live in their own file that you create in
  # THIS cluster-values overlay repo (e.g. extra-apps/example-app-2/values.yaml,
  # next to this extra-apps-values.yaml) instead of an inline `helm.values`
  # block. Add the overlay repo as a second source (forwarded as
  # `externalValues`) and reference the file with the `$cluster-values` alias.
  # example-app-2:
  #   project: default
  #   sources:
  #     - repoURL: https://example.com/some-org/some-chart.git
  #       path: charts/example-app
  #       targetRevision: v1.0.0
  #       helm:
  #         valueFiles:
  #           - $cluster-values/extra-apps/example-app-2/values.yaml
  #     - repoURL: "{{ .Values.externalValues.repoUrl }}"
  #       targetRevision: "{{ .Values.externalValues.targetRevision }}"
  #       ref: cluster-values
  #   destination:
  #     server: https://kubernetes.default.svc
  #     namespace: example-app-2
  #   syncPolicy:
  #     automated: { prune: true, selfHeal: true }
  #     syncOptions:
  #       - CreateNamespace=true

  # Chart plus static YAML the chart itself doesn't ship (an AIGatewayRoute, a
  # ReferenceGrant, ...). A source with a `path` produces manifests, so adding a
  # directory source puts them in this same Application: one health rollup, one
  # prune boundary. Manifests are read from the overlay repo directly and are
  # NOT tpl-rendered — write hostnames out literally.
  # example-app-3:
  #   project: default
  #   sources:
  #     # 1. the upstream chart
  #     - repoURL: https://example.com/some-org/some-chart.git
  #       path: charts/example-app
  #       targetRevision: v1.0.0
  #       helm:
  #         valueFiles:
  #           - $cluster-values/extra-apps/example-app-3/values.yaml
  #     # 2. your static manifests, from this overlay repo
  #     - repoURL: "{{ .Values.externalValues.repoUrl }}"
  #       targetRevision: "{{ .Values.externalValues.targetRevision }}"
  #       path: extra-apps/example-app-3/manifests
  #       directory:
  #         recurse: true
  #     # 3. resolves the $cluster-values alias above; produces no manifests
  #     - repoURL: "{{ .Values.externalValues.repoUrl }}"
  #       targetRevision: "{{ .Values.externalValues.targetRevision }}"
  #       ref: cluster-values
  #   destination:
  #     server: https://kubernetes.default.svc
  #     namespace: example-app-3
  #   syncPolicy:
  #     automated: { prune: true, selfHeal: true }
  #     syncOptions:
  #       - CreateNamespace=true
  #
  # You create both of these in the overlay repo, next to this file:
  #   extra-apps/example-app-3/values.yaml
  #   extra-apps/example-app-3/manifests/*.yaml   (must be non-empty)
