# The operator rule labels an Instinct virtual function node amd-vgpu only, but
# the DeviceConfig selects amd-gpu. The IDs are the Instinct entries of the
# amd-vgpu rule in sources/amd-gpu-operator/v1.5.1. The Radeon IDs stay out.
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: amd-gpu-instinct-vf
spec:
  rules:
    - name: amd-gpu-instinct-vf
      labels:
        feature.node.kubernetes.io/amd-gpu: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["1002"]}
            device:
              op: In
              value:
                - "7410" # MI210 VF
                - "74b5" # MI300X VF
                - "74bd" # MI300X HF VF
                - "74b6" # MI308X VF
                - "74bc" # MI308X HF VF
                - "74b9" # MI325X VF
                - "75b8" # MI350P VF
                - "75b0" # MI350X VF
                - "75b3" # MI355X VF
