# CPU-only smoke-test service. The image is public. smoke.sh removes the
# imagePullSecrets entry when GHCR_PULL_SECRET_JSON is not set, because
# aim-engine fails the model when the named secret does not exist.
#
# The object stays on v1alpha1, and aim-engine 0.2.6 warns that v1alpha1 is
# deprecated. v1alpha2 rejects spec.template, so allowUnoptimized has no place,
# and the custom model template is unoptimized. The v1alpha2 profile pipeline
# has no model.custom shortcut: it needs a base-image AIMModel and a derived
# AIMModel. See docs/future-work.md.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: aim-dummy
  namespace: aims-test
spec:
  replicas: 1
  # local-path-provisioner gives ReadWriteOnce only, and Shared mode asks for
  # ReadWriteMany.
  caching:
    mode: Dedicated
  template:
    allowUnoptimized: true
  imagePullSecrets:
    - name: aim-pull
  model:
    custom:
      baseImage: ghcr.io/silogen/aim-dummy:0.1.10
      hardware:
        cpu:
          requests: 500m
      modelSources:
        - modelId: sshleifer/tiny-gpt2
          sourceUri: hf://sshleifer/tiny-gpt2
