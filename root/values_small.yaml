externalValues:
  enabled: false
clusterForge:
  valuesFile: values.yaml
  repoUrl: "https://github.com/silogen/cluster-forge.git"


enabledApps:
  - ai-gateway-discovery
  - aim-cluster-model-source
  - aim-engine
  - aim-engine-crds
  - airm
  - airm-infra-cnpg
  - airm-infra-external-secrets
  - airm-infra-rabbitmq
  - aiwb
  - aiwb-infra-cnpg
  - aiwb-infra-external-secrets
  - amd-gpu-operator
  - amd-gpu-operator-config
  - appwrapper
  - argocd
  - argocd-config
  - cert-manager
  - cnpg-operator
  - external-secrets
  - external-secrets-config
  - inference-extension-crds
  - envoy-gateway
  - envoy-gateway-config
  - envoy-ai-gateway-crds
  - envoy-ai-gateway
  - kaiwo
  - kaiwo-config
  - kaiwo-crds
  - keda
  - kedify-otel
  - keycloak
  - kserve
  - kserve-crds
  - kuberay-operator
  - kueue
  - kueue-config
  - kyverno
  - kyverno-policies-base               # applicable to all cluster sizes
  - kyverno-policies-storage-local-path # small & medium cluster sizes only
  - metallb
  - seaweedfs-operator
  - seaweedfs-config  
  - openbao
  - openbao-config
  - opentelemetry-operator
  - otel-lgtm-stack
  - prometheus-crds
  - rabbitmq

apps:
  aiwb-infra-cnpg:
    valuesObject:
      instances: 1
  argocd:
    valuesObject:
      applicationSet:
        replicas: 1
      controller:
        replicas: 1
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m" 
            memory: "1Gi"
      redis-ha:
        enabled: false
        redis:
          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
      repoServer:
        replicas: 1
        resources:
          limits:
            cpu: "1000m" 
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
      server:
        replicas: 1
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "125m"
            memory: "256Mi"
  grafana:
    valuesObject:
      persistence:
        accessModes:
          - ReadWriteOnce
        enabled: true
        size: 5Gi
        storageClassName: direct
      replicas: 1
      resources:
        limits:
          cpu: "1000m"
          memory: "2Gi"
        requests:
          cpu: "250m"
          memory: "512Mi"
  seaweedfs-config:
    valuesObject:
      seaweed:
        storageClassName: mlstorage
        master:
          replicas: 1
          volumeSizeLimitMB: 1024
        volume:
          replicas: 1
          requests:
            storage: 250Gi
        filer:
          replicas: 1
          requests:
            storage: 10Gi
      bucket:
        name: default-bucket
        namespace: demo

  openbao:
    valuesObject:
      server:
        dataStorage:
          size: 5Gi
          storageClass: direct
        ha:
          enabled: false
          raft:
            enabled: false
          replicas: 1
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
  # Cluster size tier: SMALL / MEDIUM -- single-node clusters (1 control plane).
  #
  # small and medium are deliberately IDENTICAL for this app. The measurements
  # behind the tiers (2026-09-15/16, EAI-8713) found only one structural driver
  # of observability cost: control-plane count, not node count. A 1-CP cluster
  # produces ~137k apiserver samples / 237k series; a 3-CP cluster produces
  # ~300-390k / 400-490k. Everything else -- all daemonsets, all small
  # collectors -- measured flat across all seven clusters.
  #
  # Keep this block in sync with values_medium.yaml.
  #
  # These values match the chart defaults; they are written out explicitly so
  # the tier is readable here rather than inferred from the chart.
  otel-lgtm-stack:
    valuesObject:
      lgtm:
        # Measured 3.0-3.5 GiB on 1-CP clusters. Memory request is 25% of the
        # limit; no CPU limit (see docs/otel_lgtm_stack_tuning.md).
        resources:
          limits:
            memory: 8Gi
          requests:
            cpu: 500m
            memory: 2Gi
        storage:
          # Loki has never exceeded 1 GiB on a cluster with working retention
          # (v1.0.8, 168h). 50Gi is already ~50x headroom; the production PVC
          # that had to be expanded twice was on v1.0.7, which has no retention.
          loki: 50Gi
      collectors:
        resources:
          # otel-collector-metrics-k8s. Measured 1.4 GiB on a 1-CP cluster.
          # The 8Gi limit is deliberate: this collector has been OOMKilled at
          # 8Gi twice (epycenv 2026-09-04, workload-dev 2026-09-11) from a
          # ~2 GiB steady state, and the spike is not yet characterised.
          metrics:
            limits:
              memory: 8Gi
            requests:
              cpu: 750m
              memory: 2Gi
  prometheus:
    valuesObject:
      prometheus:
        prometheusSpec:
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          retention: 15d
          retentionSize: 20GB
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 25Gi
                storageClassName: direct
