apps:
  airm-infra-cnpg:
    valuesObject:
      instances: 2
  keycloak:
    valuesObject:
      cnpg:
        instances: 2
  seaweedfs-config:
    valuesObject:
      seaweed:
        storageClassName: mlstorage
        master:
          replicas: 3
          volumeSizeLimitMB: 1024
        volume:
          replicas: 3
          requests:
            storage: 500Gi
        filer:
          replicas: 1
          requests:
            storage: 30Gi
      bucket:
        name: default-bucket
        namespace: demo

  # Cluster size tier: LARGE -- multi-node clusters (3 control planes, 3-20 nodes).
  #
  # Only two components scale with cluster size (EAI-8713 measurements,
  # 2026-09-15/16): lgtm memory, and the k8s metrics collector, both driven by
  # control-plane count rather than node count. Every other container measured
  # flat across all seven clusters and therefore inherits the chart default,
  # which is the small/medium tier.
  otel-lgtm-stack:
    valuesObject:
      lgtm:
        # Measured 3.0-5.6 GiB on 3-CP clusters running v1.0.8. Clusters on
        # v1.0.7 read higher (~9 GiB) but have no retention, so those numbers
        # are not a valid sizing input. Some clusters already run a 16Gi limit
        # as a per-cluster patch -- this makes it the tier default.
        resources:
          limits:
            memory: 16Gi
          requests:
            cpu: 750m
            memory: 4Gi
        storage:
          # Same 50Gi as small/medium. Retention (168h) is what actually bounds
          # Loki, and measured steady state is well inside 50Gi even on a busy
          # cluster (14 GiB on a 10-node workshop cluster under real load;
          # 0.5-1.1 GiB on staging/epycenv/int-test).
          #
          # This was briefly 100Gi. The problem was not the number but the
          # change: bumping it made ArgoCD expand loki-data-pvc in place during
          # an upgrade, and Longhorn deadlocked on the live resize (int-test,
          # 2026-10-06). Clusters that already run a larger PVC keep it -- the
          # size field is in ignoreDifferences (see root/values.yaml), so this
          # value provisions new clusters and is not reconciled against
          # existing ones. Nothing is shrunk; the API server forbids that.
          loki: 50Gi
      collectors:
        resources:
          # otel-collector-metrics-k8s. Measured 0.9-2.2 GiB. Raised to 16Gi
          # because this collector has OOMKilled at 8Gi and the spike
          # is still unexplained; large clusters have the capacity to absorb it.
          metrics:
            limits:
              memory: 16Gi
            requests:
              cpu: 750m
              memory: 4Gi
  openbao:
    valuesObject:
      server:
        ha:
          enabled: true
          raft:
            enabled: true
          replicas: 3
