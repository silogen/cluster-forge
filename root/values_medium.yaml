            cpu: "200m"
            memory: "512Mi"
  aiwb-infra-external-secrets:
    valuesObject:
      resources:
        requests:
          cpu: "25m"
          memory: "128Mi"
  amd-gpu-operator:
    valuesObject:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
  cert-manager:
    valuesObject:
      resources:
        requests:
          cpu: "5m"
          memory: "256Mi"
  cnpg-operator:
    valuesObject:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
  external-secrets:
