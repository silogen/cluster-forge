{{- $domain := required "domain is required" .Values.domain }}
{{- /* The configuration holds no secret value. Dex reads the client secret and
       the password hash from the environment, which the ExternalSecret of
       dex-credentials gives. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yaml: |
    issuer: https://{{ .Values.hostPrefix }}.{{ $domain }}
    # Kubernetes storage keeps the signing keys and the refresh tokens when
    # the Pod restarts. The dex chart makes the CRDs and the RBAC for it.
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      # The password grant lets a script get a token without a browser.
      passwordConnector: local
      grantTypes:
        - authorization_code
        - refresh_token
        - password
      responseTypes:
        - code
    expiry:
      idTokens: {{ .Values.idTokenExpiry }}
    enablePasswordDB: true
    staticPasswords:
      - email: {{ .Values.user.name }}@{{ $domain }}
        username: {{ .Values.user.name }}
        userID: {{ .Values.user.id }}
        hashFromEnv: DEX_DEVUSER_PASSWORD_HASH
    staticClients:
      - id: {{ .Values.aiwb.clientId }}
        name: {{ .Values.aiwb.clientName }}
        secretEnv: DEX_AIWB_CLIENT_SECRET
        redirectURIs:
          - https://{{ .Values.aiwb.uiHostPrefix }}.{{ $domain }}/api/auth/callback/oidc
