{{- /* bcrypt adds a random salt, so each refresh writes a new hash of the same
       password. Dex reads the hash when it starts, and every hash is valid.
       The remoteRef fields that ESO defaults are written out, so Argo CD
       sees no difference. */ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecretStore }}
  refreshInterval: 1h
  target:
    name: {{ .Values.credentialsSecretName }}
    template:
      type: Opaque
      engineVersion: v2
      data:
        client-secret: {{ `"{{ .clientSecret }}"` }}
        password-hash: {{ `"{{ .password | bcrypt }}"` }}
  data:
    - remoteRef:
        key: {{ .Values.aiwb.clientSecretKey }}
        property: value
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: clientSecret
    - remoteRef:
        key: {{ .Values.user.passwordKey }}
        property: value
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: password
