{{- /* No OpenBao and no external-secrets in the demo, so the chart makes the
       passwords itself. An existing value stays, an upgrade does not rotate
       it. Two values must be equal in two places: the OIDC client secret,
       which Dex and the AIWB UI share, and the AIWB database password. Every
       value is read back from the Secret that holds it. */ -}}
{{- $pg := .Values.postgres.namespace }}
{{- $aiwbNs := .Values.aiwbNamespace }}
{{- $dexNs := .Values.dex.namespace }}

{{- define "demo.value" -}}
{{- $secret := lookup "v1" "Secret" (index . 0) (index . 1) -}}
{{- if and $secret (index $secret.data (index . 2)) -}}
{{- index $secret.data (index . 2) | b64dec -}}
{{- else -}}
{{- index . 3 -}}
{{- end -}}
{{- end -}}

{{- $superuserPassword := include "demo.value" (list $pg "postgres-superuser" "password" (randAlphaNum 32)) }}
{{- $aiwbPassword := include "demo.value" (list $pg "aiwb-db-user" "password" (randAlphaNum 32)) }}
{{- $clientSecret := include "demo.value" (list $aiwbNs "aiwb-oidc-client-secret" "value" (randAlphaNum 32)) }}
{{- $nextauthSecret := include "demo.value" (list $aiwbNs "aiwb-nextauth-secret" "NEXTAUTH_SECRET" (randAlphaNum 32)) }}
{{- $devuserPassword := include "demo.value" (list $dexNs "dex-credentials" "password" (randAlphaNum 24)) }}
{{- /* bcrypt from htpasswd. The hash is read back too, so a stable password
       keeps a stable hash and the Dex Pod does not restart on an upgrade. */ -}}
{{- $devuserHash := include "demo.value" (list $dexNs "dex-credentials" "password-hash" (htpasswd .Values.dex.user $devuserPassword | trimPrefix (printf "%s:" .Values.dex.user))) }}

{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: {{ $pg }}
type: Opaque
stringData:
  username: {{ .Values.postgres.superuser | quote }}
  password: {{ $superuserPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-db-user
  namespace: {{ $pg }}
type: Opaque
stringData:
  username: {{ .Values.postgres.aiwbUser | quote }}
  password: {{ $aiwbPassword | quote }}
---
# Dex reads the client secret and the password hash from this Secret. The
# clear password is here for the notes block and the smoke test only.
apiVersion: v1
kind: Secret
metadata:
  name: dex-credentials
  namespace: {{ $dexNs }}
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
  password: {{ $devuserPassword | quote }}
  password-hash: {{ $devuserHash | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-cnpg-user
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  username: {{ .Values.postgres.aiwbUser | quote }}
  password: {{ $aiwbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-oidc-client-secret
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  value: {{ $clientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-nextauth-secret
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ $nextauthSecret | quote }}
---
# There is no S3 in the demo. The keys are empty, so the AIWB API turns its
# object storage client off. The reference is not optional, so the Secret
# must exist.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  minio-access-key: ""
  minio-secret-key: ""
---
# OpenBao is not in the demo. aiwb-chart 2.0.3 reads this Secret with a
# reference that is not optional. The API-key page is off, so the value is
# never used.
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-openbao-token
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  value: unused
