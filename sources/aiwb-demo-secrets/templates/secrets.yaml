{{- /* No OpenBao and no external-secrets in the demo, so the chart makes the
       passwords itself. An existing value stays, an upgrade does not rotate
       it. Three values must be equal in two places: the Keycloak client
       secret, the AIWB database password and the Keycloak database password.
       Every value is read back from the Secret that holds it in namespace
       postgres. */ -}}
{{- $pg := .Values.postgres.namespace }}
{{- $aiwbNs := .Values.aiwbNamespace }}

{{- define "demo.value" -}}
{{- $secret := lookup "v1" "Secret" (index . 0) (index . 1) -}}
{{- if and $secret (index $secret.data (index . 2)) -}}
{{- index $secret.data (index . 2) | b64dec -}}
{{- else -}}
{{- index . 3 -}}
{{- end -}}
{{- end -}}

{{- $superuserPassword := include "demo.value" (list $pg "postgres-superuser" "password" (randAlphaNum 32)) }}
{{- $aiwbPassword := include "demo.value" (list $pg "aiwb-db-user" "password" (randAlphaNum 32)) }}
{{- $keycloakPassword := include "demo.value" (list $pg "keycloak-db-user" "password" (randAlphaNum 32)) }}
{{- $clientSecret := include "demo.value" (list $aiwbNs "aiwb-ui-keycloak-secret" "value" (randAlphaNum 32)) }}
{{- $nextauthSecret := include "demo.value" (list $aiwbNs "aiwb-nextauth-secret" "NEXTAUTH_SECRET" (randAlphaNum 32)) }}
{{- $adminPassword := include "demo.value" (list "keycloak" "keycloak-credentials" "KEYCLOAK_INITIAL_ADMIN_PASSWORD" (randAlphaNum 24)) }}
{{- $devuserPassword := include "demo.value" (list "keycloak" "airm-realm-credentials" "KEYCLOAK_INITIAL_DEVUSER_PASSWORD" (randAlphaNum 24)) }}
{{- $adminClientId := include "demo.value" (list "keycloak" "airm-realm-credentials" "ADMIN_CLIENT_ID" "airm-admin") }}

{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: {{ $pg }}
type: Opaque
stringData:
  username: {{ .Values.postgres.superuser | quote }}
  password: {{ $superuserPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-db-user
  namespace: {{ $pg }}
type: Opaque
stringData:
  username: {{ .Values.postgres.aiwbUser | quote }}
  password: {{ $aiwbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-user
  namespace: {{ $pg }}
type: Opaque
stringData:
  username: {{ .Values.postgres.keycloakUser | quote }}
  password: {{ $keycloakPassword | quote }}
---
# The keycloak chart reads the database user from this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-cnpg-user
  namespace: keycloak
type: Opaque
stringData:
  username: {{ .Values.postgres.keycloakUser | quote }}
  password: {{ $keycloakPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: keycloak
type: Opaque
stringData:
  KEYCLOAK_INITIAL_ADMIN_PASSWORD: {{ $adminPassword | quote }}
---
# The realm file needs all nine values. Only the frontend client secret and
# the devuser password matter in the demo, the other clients are unused.
apiVersion: v1
kind: Secret
metadata:
  name: airm-realm-credentials
  namespace: keycloak
type: Opaque
stringData:
  FRONTEND_CLIENT_SECRET: {{ $clientSecret | quote }}
  ADMIN_CLIENT_ID: {{ $adminClientId | quote }}
  ADMIN_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "ADMIN_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  CI_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "CI_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  K8S_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "K8S_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  MINIO_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "MINIO_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  GITEA_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "GITEA_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  ARGOCD_CLIENT_SECRET: {{ include "demo.value" (list "keycloak" "airm-realm-credentials" "ARGOCD_CLIENT_SECRET" (randAlphaNum 32)) | quote }}
  KEYCLOAK_INITIAL_DEVUSER_PASSWORD: {{ $devuserPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-cnpg-user
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  username: {{ .Values.postgres.aiwbUser | quote }}
  password: {{ $aiwbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-ui-keycloak-secret
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  value: {{ $clientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aiwb-nextauth-secret
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ $nextauthSecret | quote }}
---
# There is no S3 in the demo. The keys are empty, so the AIWB API turns its
# object storage client off. The reference is not optional, so the Secret
# must exist.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  minio-access-key: ""
  minio-secret-key: ""
---
# cluster-auth is not in the demo. The reference is not optional.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-auth-admin-token
  namespace: {{ $aiwbNs }}
type: Opaque
stringData:
  value: unused
