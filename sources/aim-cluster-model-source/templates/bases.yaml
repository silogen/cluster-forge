{{- $families := include "aim.hardwareFamilies" . | fromJsonArray }}
{{- if has "instinct" $families }}
# Copyright © Advanced Micro Devices, Inc., or its affiliates.
#
# SPDX-License-Identifier: MIT

apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterModelSource
metadata:
  name: amd-aim-instinct-bases
spec:
  filters:
    - image: amdenterpriseai/aim-base:0.11
    - image: amdenterpriseai/aim-base:0.12
    - image: amdenterpriseai/aim-base:0.13
    - image: amdenterpriseai/aim-base:0.13.0
    - image: amdenterpriseai/aim-base:0.13.1
  imagePullSecrets:
    - name: dockerhub-regcred
  maxModels: 10
  registry: docker.io
  syncInterval: 1h
{{- end }}
{{- if has "epyc" $families }}
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterModelSource
metadata:
  name: amd-aim-epyc-bases
spec:
  filters:
    - image: amdenterpriseai/aim-epyc-base:0.11
    - image: amdenterpriseai/aim-epyc-base:0.13
  imagePullSecrets:
    - name: dockerhub-regcred
  maxModels: 10
  registry: docker.io
  syncInterval: 1h
{{- end }}
{{- if has "radeon" $families }}
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterModelSource
metadata:
  name: amd-aim-radeon-bases
spec:
  filters:
    - image: amdenterpriseai/aim-radeon-base:0.12
  imagePullSecrets:
    - name: dockerhub-regcred
  maxModels: 10
  registry: docker.io
  syncInterval: 1h
{{- end }}
