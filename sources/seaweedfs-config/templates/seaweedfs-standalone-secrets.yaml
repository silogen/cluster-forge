{{- if .Values.standalone }}
{{- /* No OpenBao and no external-secrets here, so the chart makes the S3 and
       admin credentials itself. Existing values stay, an upgrade does not
       rotate the keys. */ -}}
{{- $ns := "seaweedfs-instance" }}
{{- $s3 := (lookup "v1" "Secret" $ns "seaweedfs-s3-config") }}
{{- $admin := (lookup "v1" "Secret" $ns "seaweedfs-admin-secret") }}
{{- $s3json := "" }}
{{- if $s3 }}
{{- $s3json = (index $s3.data "s3.json" | b64dec) }}
{{- else }}
{{- $s3json = (dict "identities" (list
      (dict "name" "Console" "actions" (list "Admin") "credentials" (list (dict "accessKey" (randAlphaNum 20) "secretKey" (randAlphaNum 40))))
      (dict "name" "ApiUser" "actions" (list "Admin") "credentials" (list (dict "accessKey" (randAlphaNum 20) "secretKey" (randAlphaNum 40))))
    ) | toPrettyJson) }}
{{- end }}
{{- $adminPassword := randAlphaNum 24 }}
{{- if $admin }}
{{- $adminPassword = (index $admin.data "admin-password" | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ $ns }}
type: Opaque
stringData:
  s3.json: |
{{ $s3json | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin-secret
  namespace: {{ $ns }}
type: Opaque
stringData:
  admin-password: {{ $adminPassword | quote }}
{{- end }}
