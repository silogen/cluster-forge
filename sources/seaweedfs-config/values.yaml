domain: # to be filled by cluster-forge app
seaweed:
  storageClassName: mlstorage
  affinity:
    topologyKey: "kubernetes.io/hostname"
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
  volume:
    replicas: 1
    requests:
      storage: 25Gi
  filer:
    replicas: 1
    requests:
      storage: 10Gi
# S3 bucket initialization
bucket:
  name: default-bucket
  namespace: demo
# S3 data-path HTTPRoute. Envoy's 15s default request timeout resets object transfers mid-stream and
# truncates them; the limit is duration, not size, so on a slow client link even a small object fails.
# Tune per cluster to the slowest transfer that should still be allowed to finish.
s3Route:
  timeouts:
    request: 30m
    backendRequest: 30m
# Get the S3 and admin credentials from OpenBao through external-secrets.
# If false, the chart makes the credentials itself.
externalSecrets:
  enabled: true
# Make the HTTPRoutes for the S3 API and the admin UI.
httpRoute:
  enabled: true
