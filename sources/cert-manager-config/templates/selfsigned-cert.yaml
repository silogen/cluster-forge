apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-cert
  namespace: {{ .Values.certificateNamespace | default .Release.Namespace }}
spec:
  dnsNames:
    - {{ .Values.domain }}
    - "*.{{ .Values.domain }}"
  secretName: cluster-tls
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
