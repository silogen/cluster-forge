domain: # to be filled by cluster-forge app

# Port configuration for Gateway listeners
ports:
  gateway: 443  # All Gateway listeners (https, k8s-passthrough, ai-passthrough, ai-gateway) on same VIP
# Apps gateway (`https`): the external LoadBalancer front door. Terminates TLS (cluster-tls)
# for apps, owns the k8s.<domain> TLS-passthrough (kube API) and the ai-passthrough listeners
# on the same :443 VIP by SNI. No separate tls-passthrough gateway.
appsGateway:
  serviceType: LoadBalancer

# Stable ClusterIP `https` selecting the apps-gateway data plane, used by CoreDNS for the
# *.domain rewrite (in-cluster resolution).
gatewayDnsService:
  enabled: true

# Dedicated AI gateway (`ai-gateway`): a separate Envoy (ClusterIP) for AIGatewayRoute traffic,
# isolating inference/EPP failures from the apps gateway (EAI-6805). The apps gateway TLS-
# passes-through routeHostname to it by SNI and ai-gateway terminates its own TLS. AI routes
# land here once ai-gateway-discovery targets it (GATEWAY_NAME=ai-gateway, in silogen/core).
# Enabling ai-gateway IS the native apiKeyAuth cutover for it (EAI-7304): ai-gateway is
# backstopped by a gateway-scoped default-deny SecurityPolicy (any model route without a
# per-model apiKeyAuth policy from ai-gateway-discovery is refused, not passed through
# unauthenticated). So only enable it once every model on ai-gateway is natively enforced — the
# ai-gateway-discovery controller (always-on enforcement) is deployed and keys are
# populated (aim-keys-<workload-id> Secrets exist) — or keyed model traffic is denied.
aiGateway:
  enabled: false
  # Namespace where the ai-gateway-discovery Service (its ext_authz handler) runs. The body-aware
  # extAuth backendRef + ReferenceGrant target this. Defaults to the canonical ai-gateway-system;
  # root/values.yaml wires it to .Values.apps.ai-gateway-discovery.namespace so it always matches
  # wherever the discovery app is actually declared (e.g. an env overlay pointing elsewhere).
  discoveryNamespace: ai-gateway-system
  # SNI host the apps gateway passes through to ai-gateway. MUST equal the discovery
  # controller's controller.gateway.routeHostname (AIRouteHostname), e.g. gateway.<domain>.
  # Required when enabled — the ai-passthrough listener/route only render when set.
  routeHostname: ""
  # Stable ClusterIP `ai-gateway` (CoreDNS target / passthrough backend).
  dnsService:
    enabled: true
  # Max request-body size (bytes) the body-aware extAuth filter buffers before calling
  # ai-gateway-discovery. Envoy returns HTTP 413 (skipping auth, overriding failOpen) once a
  # body exceeds this — so it is a hard ceiling on request size for the header-less (model-in-
  # body) path that standard OpenAI/Anthropic clients use. The upstream default of 64KiB rejects
  # ordinary large-context inference turns (a 200k-token coding request is ~1MB; image-bearing
  # turns are larger). Set to 32MiB to match clients' own request ceiling; the ai-gateway
  # ClientTrafficPolicy connection bufferLimit (50Mi) sits above it. Raising this increases the
  # memory the extAuth path may hold per in-flight header-less request. (EAI-8489.)
  bodyAuthMaxRequestBytes: 33554432
