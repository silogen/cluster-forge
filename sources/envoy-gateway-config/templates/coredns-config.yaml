{{- if eq (include "envoy-gateway-config.corednsMode" .) "helmChartConfig" }}
# CoreDNS Configuration for Wildcard Domain Routing
# Makes *.domain resolve to envoy-gateway service
#
# RKE2 only. Its helm-controller owns the rke2-coredns release and reads this to override the
# release values. A cluster without that controller accepts this object and then reads it with
# nothing, even when a shim supplies the CRD. See coredns-patch-job.yaml for those clusters.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: {{ .Values.coredns.namespace }}
spec:
  valuesContent: |-
    servers:
      - zones:
        - zone: .
        port: 53
        plugins:
        - name: errors
        - name: health
          configBlock: |-
            lameduck 10s
        - name: ready
        - name: rewrite
          parameters: continue name regex .*\.{{ .Values.domain }} https.envoy-gateway-system.svc.cluster.local answer auto
        - name: kubernetes
          parameters: cluster.local cluster.local in-addr.arpa ip6.arpa
          configBlock: |-
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        - name: prometheus
          parameters: 0.0.0.0:9153
        - name: forward
          parameters: . /etc/resolv.conf
        - name: cache
          parameters: "30"
        - name: loop
        - name: reload
        - name: loadbalance
{{- end }}
