# EnvoyProxy configuration for access logging and pod placement.
# Referenced by Gateway via infrastructure.parametersRef.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: access-logging-config
  namespace: envoy-gateway-system
spec:
{{- if .Values.aimScaleFromZero.enabled }}
  # Envoy Gateway 1.8's Strict validator does not mock Envoy 1.38's stats()
  # API. InsecureSyntax only syntax-checks policies; it bypasses the security
  # hardening performed by Strict. Restrict mutation of EnvoyExtensionPolicy
  # (and Lua ValueRef ConfigMaps) to platform admins, and restore Strict when
  # upstream validator support for stats() lands.
  luaValidation: InsecureSyntax
{{- end }}
  # Run every authorization filter before the activation counter. ext_authz
  # protects Gateway-scoped routes, while SecurityPolicy.authorization is
  # implemented by Envoy's RBAC filter. Keep both ahead of Lua so rejected
  # traffic cannot produce scale-from-zero activation metrics.
  filterOrder:
    - name: envoy.filters.http.lua
      after: envoy.filters.http.ext_authz
    - name: envoy.filters.http.rbac
      before: envoy.filters.http.lua
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # LoadBalancer: the apps gateway is the external front door and owns the VIP on :443
        # (HTTPS terminate + k8s TLS-passthrough listeners).
        type: {{ .Values.appsGateway.serviceType }}
      envoyDeployment:
        pod:
          nodeSelector:
            cluster-bloom/first-node: "true"
          priorityClassName: "system-cluster-critical"
  telemetry:
{{- if .Values.aimScaleFromZero.enabled }}
    metrics:
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            host: {{ .Values.aimScaleFromZero.collector.host | quote }}
            port: {{ .Values.aimScaleFromZero.collector.port }}
            # Convert at the source so collector restarts cannot replay the
            # proxy's cumulative history as fresh activation traffic.
            reportCountersAsDeltas: true
{{- end }}
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(X-ENVOY-ORIGINAL-METHOD?:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              total_duration: "%DURATION%"
              resp_backend_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              req_x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              authority: "%REQ(:AUTHORITY)%"
              backendHost: "%UPSTREAM_HOST%"
              backendCluster: "%UPSTREAM_CLUSTER%"
              model: "%REQ(x-ai-eg-model)%"
              llm_input_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              llm_output_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              llm_total_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_total_token)%"
              api_key_id: "%REQ(x-api-key-id)%"
              aim_service_id: "%REQ(x-ai-eg-backend)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
