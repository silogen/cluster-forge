{{- if .Values.aimScaleFromZero.enabled }}
# One platform-owned activation policy for the Gateway that directly owns AIM
# HTTPRoutes. Per-service policies would duplicate filters and metric series.
# The Gateway's ext_authz filter is explicitly ordered before Lua, so only
# authorized requests increment these counters. The EnvoyProxy currently uses
# syntax-only Lua validation because Strict lacks stats() support; access to
# create or mutate EnvoyExtensionPolicy must therefore remain platform-admin
# only. See the metrics collector README for the upgrade and security notes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: route-activation-metrics
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.aimScaleFromZero.gatewayName }}
  lua:
    - type: Inline
      inline: |
        local function metric_token(value)
          return (string.gsub(value, "([^%a%d])", function(character)
            return string.format("_x%02x", string.byte(character))
          end))
        end

        function envoy_on_request(request_handle)
          local route_name = request_handle:streamInfo():routeName()
          local kind, namespace, name = string.match(
            route_name, "^([^/]+)/([^/]+)/([^/]+)/")
          if kind ~= "httproute" or namespace == nil or name == nil then
            return
          end

          local metric_name = "aim_activation_requests.n" ..
            string.len(namespace) .. "." .. metric_token(namespace) ..
            ".r" .. string.len(name) .. "." .. metric_token(name)
          request_handle:stats():counter(metric_name):inc()
        end
{{- end }}
