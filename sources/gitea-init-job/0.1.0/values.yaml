# small|medium|large (injected by bootstrap script)
clusterSize: null

# Domain for the cluster (injected by bootstrap script)
# Example: "compute.amd.com"
domain: null

# Git revision to deploy (injected by bootstrap script)
targetRevision: null

# Base image repository for AIRM components (injected by bootstrap script when specified)
# Example: "ghcr.io/silogen"
airmImageRepository: null

# Comma-separated list of disabled apps (injected by bootstrap script when --disabled-apps is used)
# Example: "airm,airm-infra-cnpg"
disabledApps: null

# Whether to deploy only AIWB components (injected by bootstrap script when --aiwb-only is used)
aiwbOnly: false

# Comma-separated AIM hardware families to install (injected by bootstrap script when AIM_HARDWARE_FAMILY is set)
# Empty/null = install all (legacy). Example: "epyc,instinct"
aimHardwareFamily: null

# GPU stack family for the DeviceConfig driver train (injected by cluster-bloom from GPU_STACK_FAMILY).
# Empty/null = instinct (driver train 7.0). Example: "radeon"
# Does not select the GPU Operator chart. That chart is v1.5.1 for every family.
gpuStackFamily: null

# Optional override of the GPU Operator ArgoCD app path.
# Leave unset. Cluster Forge root/values.yaml pins amd-gpu-operator/v1.5.1.
# cluster-bloom does not inject this. A value here is written into cluster-values
# and overrides the release pin.
gpuOperatorPath: null

# Optional override of the GPU Operator config ArgoCD app path.
# Leave unset. Cluster Forge root/values.yaml pins amd-gpu-operator-config/v1.5.1.
# cluster-bloom does not inject this.
gpuOperatorConfigPath: null

# DeviceConfig driver train for the resolved family (injected by cluster-bloom).
# Example: "7.0" (instinct) or "7.13" (radeon). Not the host amdgpu package version.
gpuDeviceConfigDriverVersion: null
