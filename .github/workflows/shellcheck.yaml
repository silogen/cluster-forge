name: ShellCheck

on:
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sources/ holds vendored upstream charts, which we do not change
      - name: Run shellcheck
        run: git ls-files -z '*.sh' ':!:sources/' | xargs -0 shellcheck -S warning
